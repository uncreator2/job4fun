name: TopCV Automated Job Crawler & Auto-Apply Cron

on:
  schedule:
    # Chạy 5 ca mỗi ngày vào các khung giờ vàng tuyển dụng (Giờ VN: 8h, 11h, 14h, 17h, 20h)
    # Tương ứng UTC: 01:25, 04:25, 07:25, 10:25, 13:25
    - cron: '25 1,4,7,10,13 * * *'
  workflow_dispatch:
    inputs:
      action_mode:
        description: 'Chế độ chạy (all = Quét & Ứng tuyển, crawl_only = Chỉ quét danh sách, apply_only = Chỉ ứng tuyển)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - crawl_only
          - apply_only
      test_apply_url:
        description: 'URL việc làm cụ thể muốn test nộp (để trống sẽ tự động lấy từ danh sách vừa quét)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Chế độ thử nghiệm Dry-Run (true = Không bấm nộp thật, chỉ chụp ảnh form sẵn sàng; false = Nộp thật)'
        required: true
        default: 'false'
        type: boolean
      max_applies:
        description: 'Số lượng việc làm tối đa nộp trong ca này'
        required: true
        default: '3'
        type: string

jobs:
  topcv-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium

      - name: Install dependencies & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # BƯỚC 1: Quét và trích xuất danh sách việc làm mới
      - name: Crawl fresh jobs from TopCV
        if: ${{ github.event.inputs.action_mode != 'apply_only' }}
        env:
          COOKIES: ${{ secrets.COOKIES }}
          ENV_TXT: ${{ secrets.ENV_TXT }}
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          MAX_PAGES_PER_QUERY: '10'
        run: |
          python topcv_cron_runner.py

      # BƯỚC 2: Tự động điền form, sinh thư giới thiệu AI và Ứng tuyển
      - name: Auto-apply to jobs
        if: ${{ github.event.inputs.action_mode != 'crawl_only' }}
        env:
          COOKIES: ${{ secrets.COOKIES }}
          ENV_TXT: ${{ secrets.ENV_TXT }}
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          APPLY_JOB_URL: ${{ github.event.inputs.test_apply_url || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MAX_APPLIES: ${{ github.event.inputs.max_applies || '3' }}
        run: |
          python topcv_applier.py

      # BƯỚC 3: Lưu lại ảnh chụp màn hình chứng minh kết quả
      - name: Upload proof screenshots & session results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topcv-run-proofs
          path: |
            session_extracted_jobs.txt
            session_extracted_jobs.json
            *.png
          if-no-files-found: ignore

      # BƯỚC 4: Tự động lưu sổ cái lịch sử việc làm & lịch sử ứng tuyển
      - name: Commit and update history ledgers
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add extracted_jobs_history.txt extracted_jobs_history.json applied_jobs_history.txt applied_jobs_history.json || true
          git commit -m "chore: update job extraction and application history ledgers [skip ci]" || echo "No changes to commit"
          git push || echo "Push failed or no changes"
