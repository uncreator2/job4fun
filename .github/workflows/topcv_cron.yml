name: TopCV Automated Job Crawler & Auto-Apply Cron

on:
  schedule:
    # Chạy 5 ca mỗi ngày vào các khung giờ vàng tuyển dụng (Giờ VN: 8h, 11h, 14h, 17h, 20h)
    # Tương ứng UTC: 01:25, 04:25, 07:25, 10:25, 13:25
    - cron: '25 1,4,7,10,13 * * *'
  workflow_dispatch:

jobs:
  topcv-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium

      - name: Install dependencies & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # BƯỚC 1: Quét và trích xuất danh sách việc làm mới
      - name: Crawl fresh jobs from TopCV
        env:
          COOKIES: ${{ secrets.COOKIES }}
          ENV_TXT: ${{ secrets.ENV_TXT }}
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          MAX_PAGES_PER_QUERY: '10'
        run: |
          python topcv_cron_runner.py

      # BƯỚC 2: Tự động nộp hồ sơ vào các việc làm chưa ứng tuyển (100 việc/ca)
      - name: Auto-apply to unapplied jobs (100 jobs per batch)
        env:
          COOKIES: ${{ secrets.COOKIES }}
          ENV_TXT: ${{ secrets.ENV_TXT }}
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          DRY_RUN: 'false'
          MAX_APPLIES: '100'
        run: |
          python topcv_applier.py

      # BƯỚC 3: Lưu lại ảnh chụp màn hình chứng minh kết quả & thư mục lỗi
      - name: Upload proof screenshots & session results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topcv-run-proofs
          path: |
            session_extracted_jobs.txt
            session_extracted_jobs.json
            applied_jobs_history.txt
            applied_jobs_history.json
            *.png
            errors/
          if-no-files-found: ignore

      # BƯỚC 4: Tự động lưu sổ cái lịch sử việc làm, lịch sử ứng tuyển & nhật ký lỗi
      - name: Commit and update history ledgers
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add extracted_jobs_history.txt extracted_jobs_history.json applied_jobs_history.txt applied_jobs_history.json errors/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update job extraction, application history ledgers, and error logs [skip ci]"
            git pull --rebase origin main || true
            git push origin main || echo "Push failed or no changes"
          else
            echo "No ledger changes to commit"
          fi
