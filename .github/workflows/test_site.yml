name: Isolated Platform Test & Debug

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Chọn sàn muốn kiểm thử riêng lẻ'
        required: true
        type: choice
        default: 'careerviet'
        options:
          - topcv
          - vietnamworks
          - careerviet
          - vieclam24h
      mode:
        description: 'Chế độ kiểm thử'
        required: true
        type: choice
        default: 'diagnose'
        options:
          - diagnose
          - crawl_test
          - apply_test
          - all
      dry_run:
        description: 'Chế độ thử nghiệm an toàn (true = Không bấm nộp thật; false = Nộp thật)'
        required: false
        default: true
        type: boolean
      max_applies:
        description: 'Số lượng việc làm kiểm thử nộp (khi chọn apply_test / all)'
        required: false
        default: '2'
        type: string

jobs:
  isolated-platform-test:
    name: Test & Diagnose - ${{ inputs.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != 'true' ]; then
            playwright install --with-deps chromium
          else
            playwright install-deps chromium
          fi

      - name: Run Isolated Test & Diagnosis
        env:
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          COOKIES: ${{ secrets.COOKIES }}
          ENV_TXT: ${{ secrets.ENV_TXT }}
          VNW_COOKIES: ${{ secrets.VNW_COOKIES }}
          VNW_ENV: ${{ secrets.VNW_ENV }}
          V24H_COOKIES: ${{ secrets.V24H_COOKIES }}
          V24H_ENV: ${{ secrets.V24H_ENV }}
          CAREERVIET_COOKIES: ${{ secrets.CAREERVIET_COOKIES }}
          CAREERVIET_ENV: ${{ secrets.CAREERVIET_ENV }}
        run: |
          PLATFORM="${{ github.event.inputs.platform }}"
          MODE="${{ github.event.inputs.mode }}"
          MAX="${{ github.event.inputs.max_applies || '2' }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"

          CMD="python test_site.py --site $PLATFORM --mode $MODE --max $MAX"
          if [ "$DRY_RUN" != "true" ]; then
            CMD="$CMD --real-apply"
          fi

          echo "🚀 Thực thi kiểm thử riêng lẻ: $CMD"
          eval $CMD

      - name: Upload test proofs & error logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.event.inputs.platform }}-${{ github.run_id }}
          path: |
            ${{ github.event.inputs.platform }}/errors/
            ${{ github.event.inputs.platform }}/proofs/
            ${{ github.event.inputs.platform }}/apply_proof_*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Update history ledgers (if real apply)
        if: always() && github.event.inputs.dry_run == 'false'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ github.event.inputs.platform }}/extracted_jobs_history.* ${{ github.event.inputs.platform }}/applied_jobs_history.* || true
          if git diff --cached --name-only | grep -E "(extracted_jobs_history|applied_jobs_history)"; then
            git commit -m "Auto-update application ledgers for ${{ github.event.inputs.platform }} [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
